## Config by Pegasus pulse

##+++==+++==+++==+++==+++==+++==+++==+++##
[module/v2ray]
##+++==+++==+++==+++==+++==+++==+++==+++##
type = custom/script
exec = ~/.config/scripts/proxy_vpn_status
label = %output%
label-font = 2
label-background = ${colors.background2}
label-foreground = ${colors.accent}

##+++==+++==+++==+++==+++==+++==+++==+++##
[module/xworkspaces]
##+++==+++==+++==+++==+++==+++==+++==+++##
type = internal/xworkspaces

icon-0 = 1;
icon-1 = 2;
icon-2 = 3;
icon-3 = 4;
icon-4 = 5;
icon-5 = 6;
icon-6 = 7;
icon-7 = 8;
icon-8 = 9;

label-active = 
label-active-font = 4
label-active-foreground = ${colors.blue}
label-active-background = ${colors.background1}
label-active-padding = 1

label-occupied = %icon%
label-occupied-font = 4
label-occupied-background = ${colors.background1}
label-occupied-foreground = ${colors.altblue}
label-occupied-padding = 1

label-urgent = %icon%
label-urgent-font = 4
label-urgent-foreground = ${colors.red}
label-urgent-background = ${colors.red}
label-urgent-underline = ${colors.red}
label-urgent-padding = 1

label-empty = %icon%
label-empty-font = 4
label-empty-foreground = ${colors.black}
label-empty-padding = 1

##+++==+++==+++==+++==+++==+++==+++==+++##
[module/xwindow]
##+++==+++==+++==+++==+++==+++==+++==+++##
type = internal/xwindow
label = %class%
label-foreground = ${colors.accent}

##+++==+++==+++==+++==+++==+++==+++==+++##
[module/cpu]
##+++==+++==+++==+++==+++==+++==+++==+++##
type = internal/cpu
interval = 0.1
format-prefix = "%{A1::} %{A}"
format-prefix-font = 2
format-prefix-background = ${colors.background1}
format-prefix-foreground = ${colors.accent}
label = %percentage:%%
label-background = ${colors.background1}
label-foreground = ${colors.altblue}

##+++==+++==+++==+++==+++==+++==+++==+++##
[module/memory]
##+++==+++==+++==+++==+++==+++==+++==+++##
type = internal/memory
interval = 0.1
format-prefix = " "
format-prefix-font = 2
format-prefix-background = ${colors.background2}
format-prefix-foreground = ${colors.accent}
label = %percentage_used:%%
label-background = ${colors.background2}
label-foreground = ${colors.altblue}

##+++==+++==+++==+++==+++==+++==+++==+++##
[module/pulseaudio]
##+++==+++==+++==+++==+++==+++==+++==+++##
type = internal/pulseaudio
use-ui-max = false

format-volume = <ramp-volume><label-volume>

ramp-volume-0 = " "
ramp-volume-1 = " "
ramp-volume-2 = " "
ramp-volume-font = 2
ramp-volume-background = ${colors.background3}
ramp-volume-foreground = ${colors.accent}

label-volume = %percentage%
label-volume-background = ${colors.background3}
label-volume-foreground = ${colors.altblue}

label-muted =  0
label-muted-background = ${colors.background3}
label-muted-foreground = ${colors.black}

click-middle = pavucontrol

##+++==+++==+++==+++==+++==+++==+++==+++##
[network]
##+++==+++==+++==+++==+++==+++==+++==+++##
type = internal/network
interval = 0.1
format-connected = <label-connected>
format-disconnected = <label-disconnected>
format-connected-background = ${colors.background4}
format-connected-foreground = ${colors.accent}
format-disconnected-background = ${colors.background4}
format-disconnected-foreground = ${colors.black}

[module/wireless]
inherit = network
interface-type = wireless
format-connected-prefix =  %{A1:nm-connection-editor:}󰖩%{A}
format-connected-prefix-font = 2
format-disconnected-prefix = %{A1:nm-connection-editor:}󰖪%{A}
format-disconnected-prefix-font = 2
label-connected = "%{A1}%{A}"
label-disconnected = "%{A1}%{A}"

[module/wired]
inherit = network
interface-type = wired
format-connected-prefix = %{A1:nm-connection-editor:}󰲝%{A}
format-connected-prefix-font = 2
format-disconnected-prefix = %{A1:nm-connection-editor:}󰲜%{A}
format-disconnected-prefix-font = 2
label-connected = "%{A1}%{A}"
label-disconnected = "%{A1}%{A}"

##+++==+++==+++==+++==+++==+++==+++==+++##
[module/time]
##+++==+++==+++==+++==+++==+++==+++==+++##
type = internal/date
interval = 0.1
date = %H:%M
date-alt = %l:%M
label = %date%
label-background = ${colors.background1}
label-foreground = ${colors.altblue}

##+++==+++==+++==+++==+++==+++==+++==+++##
[module/date2]
##+++==+++==+++==+++==+++==+++==+++==+++##
type = internal/date
interval = 0.1
date = %a, %d
date-alt = %a, %b %d
label = %date%
label-background = ${colors.background1}
label-foreground = ${colors.altblue}

##+++==+++==+++==+++==+++==+++==+++==+++##
[module/mpd]
##+++==+++==+++==+++==+++==+++==+++==+++##
type = internal/mpd
interval = 2
format-online = <icon-prev><toggle><icon-next>

format-playing = ${self.format-online}
format-paused = ${self.format-online}
format-stopped = <icon-prev><toggle><icon-next>

label-song =  "%title%"
label-song-background = ${colors.background1}
label-song-foreground = ${colors.altblue}
label-song-maxlen = 25
label-song-ellipsis = false

label-offline = "Offline"

icon-play = " "
icon-play-font = 2
icon-play-background = ${colors.background1}
icon-play-foreground = ${colors.green}
icon-pause = " "
icon-pause-font = 2
icon-pause-background = ${colors.background1}
icon-pause-foreground = ${colors.altgreen}
icon-stop = " "
icon-stop-font = 2
icon-stop-background = ${colors.background1}
icon-stop-foreground = ${colors.red}
icon-prev = "󰙣 "
icon-prev-font = 2
icon-prev-background = ${colors.background1}
icon-prev-foreground = ${colors.cyan}
icon-next = "󰙡"
icon-next-font = 2
icon-next-background = ${colors.background1}
icon-next-foreground = ${colors.cyan}

##+++==+++==+++==+++==+++==+++==+++==+++##
[module/nowplaying]
##+++==+++==+++==+++==+++==+++==+++==+++##
type = internal/mpd
interval = 2
format-online = <label-song>

format-playing = ${self.format-online}
format-paused = ${self.format-online}
format-stopped = <label-song>

label-song =  "%title%"
label-song-foreground = ${colors.accent}
label-song-maxlen = 30
label-song-ellipsis = false

label-offline =

##+++==+++==+++==+++==+++==+++==+++==+++##
[module/tray]
##+++==+++==+++==+++==+++==+++==+++==+++##
type = custom/script
exec = echo ""
format = <label>
format-font = 2
format-background = ${colors.background5}
format-foreground = ${colors.accent}
click-left =  ~/.config/scripts/stalonetray
