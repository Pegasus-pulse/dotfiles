##+++==+++==+++==+++==+++==+++==+++==+++##
##   General				            ##
##+++==+++==+++==+++==+++==+++==+++==+++##

# Available backends "xrender" "glx" "egl"
backend = "glx"
vsync = true;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;

log-level = "warn";

##+++==+++==+++==+++==+++==+++==+++==+++##
##   Fading				                ##
##+++==+++==+++==+++==+++==+++==+++==+++##
fading = true;

fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5
no-fading-openclose = false

##+++==+++==+++==+++==+++==+++==+++==+++##
##   Shadow				                ##
##+++==+++==+++==+++==+++==+++==+++==+++##
shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-color = "#000000"

##+++==+++==+++==+++==+++==+++==+++==+++##
##   Opacity				            ##
##+++==+++==+++==+++==+++==+++==+++==+++##
frame-opacity = 1.0;

##+++==+++==+++==+++==+++==+++==+++==+++##
##   Corners				            ##
##+++==+++==+++==+++==+++==+++==+++==+++##
corner-radius = 6
round-borders = 1

##+++==+++==+++==+++==+++==+++==+++==+++##
##   Rules		                        ##
##+++==+++==+++==+++==+++==+++==+++==+++##

blur:

    {
		method = "gaussian";
		size = 15;
		deviation = 3.5;
	}

rules: (

	{
		match = "window_type = 'normal'";
		fade = true;
		shadow = true;
        opacity = 0.8;
	},

    {
        match = "focused || group_focused"
        opacity = 1.0;
    },

	{
		match = "window_type = 'dialog'";
		shadow = true;
	},

	{
		match = "window_type = 'tooltip'";
        fade = true;
		opacity = 0.8;
        shadow = true;
        focus = true;
        full-shadow = false;
	},

	{
		match = "window_type = 'dock'";
        corner-radius = 0;
		fade = true;
        shadow = false;
        blur-background = false;
        clip-shadow-above = true;
	},

	{
		match = "window_type = 'dropdown_menu' || window_type = 'menu' || window_type = 'Popup' || window_type = 'popup_menu'";
		shadow = false;
        blur-background = false;
	},

    {
        # Fix shadow related bugs on small UI elements
        match = "window_type ='dnd' || window_type = 'menu' || role = 'Popup' || role = 'bubble'";
        shadow = false;
    },

    {
		match = "class_g = 'Dunst'			|| "
				"class_g = 'Rofi'			|| "
                "class_g = 'Eww'			|| "
                "class_g = 'librewolf'";
        blur-background = false;
        opacity = 1.0;
	},

    {
		match = "class_g = 'Eww'	|| "
                "class_g = 'librewolf'";
        focus = false;
	},

	{
		match = "name = 'Notification'		|| "
				"class_g = 'Dunst'			|| "
				"class_g = 'Polybar'		|| "
				"class_g = 'Eww'			|| "
				"class_g = 'Rofi'			|| "
				"_GTK_FRAME_EXTENTS@";
		shadow = false;
        corner-radius = 0;
	},

@include "picom-animations.conf"

)
